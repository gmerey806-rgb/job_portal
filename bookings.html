<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase - Брондалған билеттер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            color: #333;
            padding: 20px 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }
        .header i { 
            font-size: 4rem; 
            color: #ffd700; 
            margin-bottom: 20px; 
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .header h1 { 
            font-size: 3rem; 
            font-weight: 700; 
            margin-bottom: 10px; 
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { 
            font-size: 1.2rem; 
            opacity: 0.95; 
            max-width: 600px;
            margin: 0 auto;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 25px 35px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
            color: white;
        }
        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
            color: #ffd700;
        }
        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Tickets Grid */
        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .ticket-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: all 0.4s ease;
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }
        .ticket-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #2563eb, #10b981, #f59e0b);
        }
        .ticket-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
        }

        .ticket-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        .ticket-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        .ticket-number {
            font-size: 1.1rem;
            font-weight: 600;
            color: #6b7280;
            font-family: 'Courier New', monospace;
        }

        .ticket-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .ticket-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #2563eb;
        }
        .detail-icon { color: #2563eb; font-size: 1.1rem; }
        .detail-label { font-weight: 500; color: #374151; }
        .detail-value { font-weight: 600; color: #1f2937; margin-left: auto; }

        .ticket-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .status-confirmed {
            background: rgba(16,185,129,0.15);
            color: #10b981;
            border: 2px solid #10b981;
        }
        .status-pending {
            background: rgba(245,158,11,0.15);
            color: #f59e0b;
            border: 2px solid #f59e0b;
        }

        .ticket-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(45deg, #2563eb, #1d4ed8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37,99,235,0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.7);
            color: #374151;
            border: 2px solid #e5e7eb;
        }
        .btn-secondary:hover {
            background: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.8);
        }
        .empty-state i {
            font-size: 6rem;
            margin-bottom: 30px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        /* Buttons */
        .back-btn {
            display: inline-block;
            margin: 0 auto 50px;
            padding: 18px 40px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; }
            .stats { gap: 2rem; }
            .tickets-grid { grid-template-columns: 1fr; }
            .ticket-details { grid-template-columns: 1fr; }
            .ticket-actions { flex-direction: column; }
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ticket-card {
            animation: fadeInUp 0.6s ease forwards;
        }
        .ticket-card:nth-child(2) { animation-delay: 0.1s; }
        .ticket-card:nth-child(3) { animation-delay: 0.2s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <i class="fas fa-ticket-alt"></i>
            <h1>Брондалған билеттер</h1>
            <p>Сіздің барлық брондалған турларыңыз осында. Барлығын бір көзбен бақылаңыз</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <span class="stat-number" id="totalBookings">0</span>
                <span class="stat-label">Жалпы брондар</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="confirmedBookings">0</span>
                <span class="stat-label">Расталған</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="pendingBookings">0</span>
                <span class="stat-label">Күтілуде</span>
            </div>
        </div>

        <!-- Tickets -->
        <div class="tickets-grid" id="ticketsGrid">
            <!-- Билеттер динамикалық қосылады -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-plane-slash"></i>
            <h3>Әзірге брондалған билет жоқ</h3>
            <p>Басты беттен алғашқы турыңызды брондаңыз!</p>
        </div>

        <!-- Back Button -->
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Басты бетке қайту
        </a>
    </div>

    <script>
        // Брондарды жүктеу және көрсету
        function loadBookings() {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            
            // Статистика
            document.getElementById('totalBookings').textContent = bookings.length;
            const confirmed = bookings.filter(b => b.status !== 'cancelled').length;
            const pending = bookings.filter(b => b.status === 'pending').length;
            document.getElementById('confirmedBookings').textContent = confirmed;
            document.getElementById('pendingBookings').textContent = pending;

            const grid = document.getElementById('ticketsGrid');
            const emptyState = document.getElementById('emptyState');

            if (bookings.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            // Билеттерді көрсету
            grid.innerHTML = bookings.map((booking, index) => {
                const statusClass = booking.status === 'confirmed' ? 'status-confirmed' : 'status-pending';
                const statusText = booking.status === 'confirmed' ? '✅ Расталған' : '⏳ Күтілуде';
                const statusIcon = booking.status === 'confirmed' ? 'fas fa-check-circle' : 'fas fa-clock';

                return `
                    <div class="ticket-card">
                        <div class="ticket-header">
                            <div class="ticket-icon">
                                <i class="fas fa-plane-departure"></i>
                            </div>
                            <div class="ticket-number">Брон № ${booking.id || index + 1}</div>
                        </div>
                        
                        <h3 class="ticket-title">${booking.tourName}</h3>
                        
                        <div class="ticket-details">
                            <div class="detail-item">
                                <i class="fas fa-user detail-icon"></i>
                                <span class="detail-label">Пассажир:</span>
                                <span class="detail-value">${booking.customerName}</span>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-calendar detail-icon"></i>
                                <span class="detail-label">Күні:</span>
                                <span class="detail-value">${booking.date}</span>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-phone detail-icon"></i>
                                <span class="detail-label">Телефон:</span>
                                <span class="detail-value">${booking.phone}</span>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-clock detail-icon"></i>
                                <span class="detail-label">Брондалған:</span>
                                <span class="detail-value">${new Date(booking.timestamp || booking.date).toLocaleDateString('kk-KZ')}</span>
                            </div>
                        </div>
                        
                        <div class="ticket-status ${statusClass}">
                            <i class="${statusIcon}"></i>
                            ${statusText}
                        </div>
                        
                        <div class="ticket-actions">
                            <button class="btn btn-primary" onclick="printTicket(${index})">
                                <i class="fas fa-print"></i>
                                Басып шығару
                            </button>
                            <button class="btn btn-secondary" onclick="toggleStatus(${index})">
                                <i class="fas fa-sync-alt"></i>
                                ${booking.status === 'confirmed' ? 'Күтуге' : 'Расталу'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Билетті басып шығару
        function printTicket(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const booking = bookings[index];
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Брондалған билет №${booking.id || index + 1}</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 0; padding: 30px; background: #f8fafc; }
                        .print-ticket { 
                            max-width: 500px; 
                            margin: 0 auto; 
                            background: white; 
                            padding: 40px; 
                            border-radius: 20px; 
                            box-shadow: 0 10px 50px rgba(0,0,0,0.1);
                            border-top: 8px solid #2563eb;
                        }
                        .header { text-align: center; margin-bottom: 30px; }
                        .header i { font-size: 4rem; color: #2563eb; margin-bottom: 15px; }
                        .title { font-size: 2.2rem; color: #1f2937; font-weight: bold; margin-bottom: 10px; }
                        .ticket-id { 
                            background: linear-gradient(135deg, #667eea, #764ba2); 
                            color: white; 
                            padding: 15px 25px; 
                            border-radius: 12px; 
                            font-family: monospace; 
                            font-size: 1.2rem; 
                            text-align: center; 
                            margin: 25px 0;
                        }
                        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
                        .info-item { background: #f8fafc; padding: 20px; border-radius: 12px; border-left: 5px solid #2563eb; }
                        .info-label { color: #6b7280; font-weight: 500; margin-bottom: 5px; }
                        .info-value { font-size: 1.2rem; font-weight: 700; color: #1f2937; }
                        .status { 
                            text-align: center; 
                            padding: 15px 30px; 
                            border-radius: 30px; 
                            font-weight: 700; 
                            font-size: 1.1rem;
                            margin: 25px 0;
                        }
                        .status-confirmed { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
                        @media print { body { padding: 10px; } .print-ticket { box-shadow: none; border-radius: 0; } }
                    </style>
                </head>
                <body>
                    <div class="print-ticket">
                        <div class="header">
                            <i class="fas fa-plane-departure"></i>
                            <h1 class="title">TravelEase Билеті</h1>
                        </div>
                        <div class="ticket-id">Брон № ${booking.id || index + 1}</div>
                        
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Тур бағыты</div>
                                <div class="info-value">${booking.tourName}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Пассажир</div>
                                <div class="info-value">${booking.customerName}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Күні</div>
                                <div class="info-value">${booking.date}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Телефон</div>
                                <div class="info-value">${booking.phone}</div>
                            </div>
                        </div>
                        
                        <div class="status status-confirmed">✅ Брондалған және расталған</div>
                        
                        <div style="text-align: center; margin-top: 30px; font-size: 0.9rem; color: #6b7280;">
                            TravelEase - Сіздің сенімді саяхат серіктесіңіз<br>
                            Брондалған: ${new Date(booking.timestamp || booking.date).toLocaleDateString('kk-KZ')}
                        </div>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        // Статусты ауыстыру
        function toggleStatus(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            if (bookings[index]) {
                bookings[index].status = bookings[index].status === 'confirmed' ? 'pending' : 'confirmed';
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadBookings();
                showNotification('Статус өзгертілді!', 'success');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed; top: 20px; right: 20px; 
                background: ${type === 'success' ? '#10b981' : '#ef4444'};
                color: white; padding: 15px 25px; border-radius: 10px;
                font-weight: 600; z-index: 10000; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
                animation: slideInRight 0.3s;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Бет жүктелгенде
        document.addEventListener('DOMContentLoaded', loadBookings);
    </script>
</body>
</html>
