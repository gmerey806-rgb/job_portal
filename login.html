<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кіру | JobConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f0f23, #1a1a2e, #16213e, #0f172a);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Geometric Background Elements */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                conic-gradient(from 45deg at 20% 20%, rgba(0, 255, 213, 0.1), transparent 50%),
                conic-gradient(from 225deg at 80% 80%, rgba(255, 0, 212, 0.08), transparent 50%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Main Login Card - Split Design */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 0;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .login-card:hover {
            transform: scale(1.02) rotateX(2deg);
            box-shadow: 
                0 50px 100px rgba(0, 255, 213, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* Left Side - Brand */
        .brand-section {
            background: linear-gradient(135deg, rgba(0, 255, 213, 0.15), rgba(255, 0, 212, 0.1));
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffd5, #ffffff, #ff00d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            display: block;
        }

        .brand-title {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .brand-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        /* Right Side - Form */
        .form-section {
            padding: 3.5rem 3rem;
            background: rgba(0, 0, 0, 0.3);
        }

        .form-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #00ffd5, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Input Groups - Floating Labels */
        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-group label {
            position: absolute;
            top: 1rem;
            left: 3rem;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 1.5rem 1.5rem 1.5rem 3rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .input-group input:focus {
            border-color: rgba(0, 255, 213, 0.6);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(0, 255, 213, 0.15);
            transform: translateY(-2px);
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -0.5rem;
            left: 2rem;
            font-size: 0.85rem;
            color: #00ffd5;
            background: rgba(15, 15, 35, 0.9);
            padding: 0 0.5rem;
            border-radius: 8px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 1.2rem;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .input-group input:focus ~ i {
            color: #00ffd5;
            transform: translateY(-50%) scale(1.1);
        }

        /* Primary Button - Neon Style */
        .login-btn {
            width: 100%;
            padding: 1.4rem 2rem;
            background: linear-gradient(145deg, #00ffd5, #00b8a9);
            border: none;
            border-radius: 20px;
            color: #0f0f23;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 
                0 15px 35px rgba(0, 255, 213, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s;
        }

        .login-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 25px 50px rgba(0, 255, 213, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Divider */
        .divider {
            position: relative;
            text-align: center;
            margin: 2rem 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        /* Social Buttons */
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(15px);
        }

        .social-btn:hover {
            border-color: rgba(0, 255, 213, 0.5);
            background: rgba(0, 255, 213, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 213, 0.2);
        }

        /* Register Link */
        .register-link {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .register-link a {
            color: #00ffd5;
            font-weight: 700;
            text-decoration: none;
            position: relative;
        }

        .register-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffd5, #ff00d4);
            transition: width 0.3s ease;
        }

        .register-link a:hover::after {
            width: 100%;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 100px;
            right: -400px;
            background: linear-gradient(135deg, #00ffd5, #00b8a9);
            color: #0f0f23;
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 255, 213, 0.4);
            z-index: 10000;
            font-weight: 700;
            font-size: 1rem;
            max-width: 400px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(20px);
        }

        .toast.error {
            background: linear-gradient(135deg, #ff6b6b, #ef4444);
            color: white;
        }

        .toast.show {
            right: 30px;
        }

        /* Loading Spinner */
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            border: 3px solid rgba(0, 255, 213, 0.3);
            border-top: 3px solid #00ffd5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-card {
                margin: 1rem;
                border-radius: 20px;
            }
            .brand-section, .form-section {
                padding: 2rem 1.5rem;
            }
            .social-login {
                grid-template-columns: 1fr;
            }
        }

        /* Entrance Animation */
        .login-card {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            animation: slideInUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
        }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand Section -->
            <div class="brand-section">
                <div class="logo">JobConnect</div>
                <div class="brand-title">Ақтөбе жұмыс орталығы</div>
                <div class="brand-desc">Колледж түлектері мен жұмыс берушілерді біріктіреміз</div>
            </div>

            <!-- Form Section -->
            <div class="form-section">
                <div class="loading" id="loading"></div>
                <h2 class="form-title">
                    <i class="fas fa-sign-in-alt"></i> Жүйеге кіру
                </h2>

                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="email" id="email" placeholder=" " required>
                        <label>Email</label>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder=" " required>
                        <label>Құпия сөз</label>
                    </div>

                    <button type="submit" class="login-btn">
                        <i class="fas fa-arrow-right"></i>
                        Кіру
                    </button>
                </form>

                <div class="divider">немесе</div>

                <div class="social-login">
                    <a href="#" class="social-btn">
                        <i class="fab fa-google"></i>
                        Google
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fab fa-telegram"></i>
                        Telegram
                    </a>
                </div>

                <div class="register-link">
                    Аккаунт жоқ па? <a href="register.html">Тіркелу</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Smooth login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.login-btn');
            const loading = document.getElementById('loading');

            if (!email || !password) {
                showToast('❌ Барлық өрістерді толтырыңыз!', '#ff6b6b');
                return;
            }

            // Show loading
            btn.style.opacity = '0.7';
            btn.disabled = true;
            loading.style.display = 'block';

            // Simulate API call
            setTimeout(() => {
                showToast('✅ Сәтті кірдіңіз! Бет жүктелуде...', '#00ffd5');
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1200);
            }, 2200);
        }

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // Toast notification
        function showToast(message, color) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (color === '#ff6b6b') toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => document.body.removeChild(toast), 500);
            }, 4000);
        }

        // Form validation
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                this.style.borderColor = this.value ? 'rgba(0, 255, 213, 0.4)' : 'rgba(255, 255, 255, 0.1)';
            });
        });
    </script>
</body>
</html>
